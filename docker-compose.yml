services:
  php:
    container_name: "${COMPOSE_PROJECT_NAME}_php"
    build: "./docker/php/"
    user: "1000:1000"
    volumes:
      - "./:/var/www/html"
    environment:
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASSWORD}
      POSTS_PAGE_LIMIT: ${POSTS_PAGE_LIMIT}
    depends_on:
        - mysql
  nginx:
    container_name: "${COMPOSE_PROJECT_NAME}_nginx"
    image: "nginx"
    volumes:
      - "./:/var/www/html"
      - "./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf"
    ports:
      - "80:80"
    environment:
      - DEV_DOMAIN=${DEV_DOMAIN}
    depends_on:
      - php
  mysql:
    container_name: "${COMPOSE_PROJECT_NAME}_mysql"
    image: "mysql:8.0"
    volumes:
      - "./docker/mysql/temp:/var/lib/mysql"
    ports:
      - "3333:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: user
      MYSQL_PASSWORD: user
